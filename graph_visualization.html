        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 3, "color": {"background": "#00f3ff", "border": "#ff007f", "highlight": {"background": "#39ff14", "border": "#ffffff"}, "hover": {"background": "#ffe600", "border": "#ff007f"}}, "font": {"color": "#00f3ff"}, "id": "1", "label": " 1 ", "shadow": {"color": "rgba(0, 243, 255, 0.6)", "enabled": true, "size": 20, "x": 0, "y": 0}, "shape": "dot", "size": 32, "title": "Vertex 1\nDegree: 2\nNeighbors: [2, 4]"}, {"borderWidth": 3, "color": {"background": "#00f3ff", "border": "#ff007f", "highlight": {"background": "#39ff14", "border": "#ffffff"}, "hover": {"background": "#ffe600", "border": "#ff007f"}}, "font": {"color": "#00f3ff"}, "id": "2", "label": " 2 ", "shadow": {"color": "rgba(0, 243, 255, 0.6)", "enabled": true, "size": 20, "x": 0, "y": 0}, "shape": "dot", "size": 36, "title": "Vertex 2\nDegree: 3\nNeighbors: [1, 3, 4]"}, {"borderWidth": 3, "color": {"background": "#00f3ff", "border": "#ff007f", "highlight": {"background": "#39ff14", "border": "#ffffff"}, "hover": {"background": "#ffe600", "border": "#ff007f"}}, "font": {"color": "#00f3ff"}, "id": "3", "label": " 3 ", "shadow": {"color": "rgba(0, 243, 255, 0.6)", "enabled": true, "size": 20, "x": 0, "y": 0}, "shape": "dot", "size": 32, "title": "Vertex 3\nDegree: 2\nNeighbors: [2, 4]"}, {"borderWidth": 3, "color": {"background": "#00f3ff", "border": "#ff007f", "highlight": {"background": "#39ff14", "border": "#ffffff"}, "hover": {"background": "#ffe600", "border": "#ff007f"}}, "font": {"color": "#00f3ff"}, "id": "4", "label": " 4 ", "shadow": {"color": "rgba(0, 243, 255, 0.6)", "enabled": true, "size": 20, "x": 0, "y": 0}, "shape": "dot", "size": 36, "title": "Vertex 4\nDegree: 3\nNeighbors: [1, 2, 3]"}]);
                  edges = new vis.DataSet([{"color": {"color": "rgba(255, 0, 127, 0.55)", "highlight": "#00f3ff", "hover": "#39ff14"}, "from": "1", "smooth": {"roundness": 0.25, "type": "continuous"}, "to": "2", "width": 2.5}, {"color": {"color": "rgba(255, 0, 127, 0.55)", "highlight": "#00f3ff", "hover": "#39ff14"}, "from": "2", "smooth": {"roundness": 0.25, "type": "continuous"}, "to": "3", "width": 2.5}, {"color": {"color": "rgba(255, 0, 127, 0.55)", "highlight": "#00f3ff", "hover": "#39ff14"}, "from": "3", "smooth": {"roundness": 0.25, "type": "continuous"}, "to": "4", "width": 2.5}, {"color": {"color": "rgba(255, 0, 127, 0.55)", "highlight": "#00f3ff", "hover": "#39ff14"}, "from": "4", "smooth": {"roundness": 0.25, "type": "continuous"}, "to": "1", "width": 2.5}, {"color": {"color": "rgba(255, 0, 127, 0.55)", "highlight": "#00f3ff", "hover": "#39ff14"}, "from": "2", "smooth": {"roundness": 0.25, "type": "continuous"}, "to": "4", "width": 2.5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"font": {"size": 16, "face": "'JetBrainsMono','CourierNew',monospace", "color": "#00f3ff", "bold": true}}, "physics": {"barnesHut": {"gravitationalConstant": -3800, "centralGravity": 0.15, "springLength": 110, "springConstant": 0.05, "damping": 0.09}, "stabilization": {"iterations": 180}}, "interaction": {"hover": true, "navigationButtons": true, "zoomView": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
